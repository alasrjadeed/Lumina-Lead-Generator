version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: hybrid-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - hybrid-ai-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: hybrid-ai-server
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - whatsapp-session:/app/whatsapp-session
    networks:
      - hybrid-ai-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: hybrid-ai-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - hybrid-ai-network

volumes:
  mongo-data:
  whatsapp-session:

networks:
  hybrid-ai-network:
    driver: bridge
